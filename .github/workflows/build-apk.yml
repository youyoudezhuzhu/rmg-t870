name: Build T870 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exploit source (Root-My-Galaxy-Payloads)
        run: |
          git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git /tmp/rmg-src || true
          if [ ! -d /tmp/rmg-src ]; then
            echo "FAILED to clone rmg-src"
            exit 1
          fi
          # 用我们修正过的 4.19 target.h 覆盖官方源码（t870 目录可能不存在，先创建）
          mkdir -p /tmp/rmg-src/src/targets/t870-T870XXS8DXH1
          cp $GITHUB_WORKSPACE/patches/t870-target-fixed.h \
             /tmp/rmg-src/src/targets/t870-T870XXS8DXH1/target.h
          echo "target.h 已覆盖为修正版"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install ONDK (lightweight NDK for arm64 Android)
        run: |
          curl -fL -o /tmp/ondk.tar.xz "https://github.com/topjohnwu/ondk/releases/download/r30.1/ondk-r30.1-linux.tar.xz"
          mkdir -p /tmp/ondk
          tar -C /tmp/ondk --strip-components=1 -xf /tmp/ondk.tar.xz
          ls /tmp/ondk/toolchains/llvm/prebuilt/*/bin/aarch64-linux-android35-clang

      - name: Build exploit payload (old arch, fixed 4.19 offsets)
        working-directory: /tmp/rmg-src
        run: |
          export ANDROID_NDK_HOME=/tmp/ondk
          export NDK_ROOT=/tmp/ondk
          make TARGET=t870-T870XXS8DXH1
          ls -la build/t870-T870XXS8DXH1/

      - name: Copy payload into app assets
        run: |
          cp /tmp/rmg-src/build/t870-T870XXS8DXH1/cve-2026-43499-app.so \
             app-src/app/src/main/assets/cve-2026-43499-app.so
          ls -la app-src/app/src/main/assets/cve-2026-43499-app.so

      - name: Build APK
        working-directory: app-src
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmg-t870-test-apk
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-src/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
